name: Update terminal stats

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      # Regenera assets/terminal.svg con la cara guardada en tools/face_levels.json (sin foto) y stats nuevas
      - run: python tools/gen.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg
          git diff --cached --quiet || (git commit -m "Update terminal stats" && git push)
